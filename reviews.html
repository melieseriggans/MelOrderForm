<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#fedde4" />
<title>Leave A Review – Mel's Treat</title>
<link rel="icon" type="image/png" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Baloo+2:wght@600;700;800&family=Pacifico&display=swap" rel="stylesheet">
<style>
  :root{
    --pink-light:#fedde4;
    --pink-hot:#e20376;
    --white:#ffffff;
    --ink:#3a2430;
    --ink-soft:#8a6b78;
    --border:#f7c3d6;
    --shadow: 0 6px 20px rgba(226,3,118,0.10);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    position:relative;
    margin:0;
    min-height:100vh;
    background:var(--pink-light);
    font-family:'Quicksand', sans-serif;
    color:var(--ink);
    padding-bottom:60px;
  }
  .banner{
    background:linear-gradient(135deg, var(--pink-hot), #ff5fa8);
    padding:44px 20px 52px;
    text-align:center;
    color:var(--white);
    border-radius:0 0 32px 32px;
    box-shadow:var(--shadow);
    position:relative;
    overflow:hidden;
  }
  .banner-logo{
    width:80px;
    height:80px;
    border-radius:50%;
    object-fit:cover;
    margin-bottom:10px;
    box-shadow:0 4px 14px rgba(0,0,0,0.15);
  }
  .banner h1{
    font-family:'Baloo 2', cursive;
    font-weight:800;
    font-size:2.2rem;
    margin:0 0 6px;
  }
  .banner .sub{
    font-size:1rem;
    max-width:420px;
    margin:0 auto;
    opacity:0.96;
  }
  .container{
    max-width:480px;
    margin:-26px auto 0;
    padding:0 16px;
  }
  .card{
    background:var(--white);
    border-radius:22px;
    padding:24px 20px;
    margin-bottom:18px;
    box-shadow:var(--shadow);
    border:1px solid var(--border);
  }
  label{
    display:block;
    font-weight:700;
    font-size:0.9rem;
    margin:16px 0 6px;
  }
  label:first-child{margin-top:0;}
  input[type=text], textarea{
    width:100%;
    padding:12px 14px;
    border-radius:12px;
    border:1.5px solid var(--border);
    font-family:inherit;
    font-size:0.95rem;
    background:var(--white);
    color:var(--ink);
  }
  textarea{min-height:120px; resize:vertical;}
  input:focus, textarea:focus{outline:2px solid var(--pink-hot); outline-offset:1px;}
  .stars{
    display:flex;
    gap:8px;
    justify-content:center;
    margin:8px 0 4px;
  }
  .star{
    font-size:2.4rem;
    line-height:1;
    cursor:pointer;
    color:var(--border);
    background:none;
    border:none;
    padding:0;
    transition:0.1s;
  }
  .star.filled{color:#e20376;}
  .star:active{transform:scale(1.15);}
  .rating-label{
    text-align:center;
    font-weight:700;
    color:#e20376;
    font-size:0.9rem;
    min-height:1.2em;
    margin-bottom:6px;
  }
  .subrating-grid{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-top:16px;
  }
  .subrating-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--pink-light);
    border-radius:12px;
    padding:10px 14px;
  }
  .subrating-label{
    margin:0;
    font-weight:700;
    font-size:0.88rem;
    color:var(--ink);
  }
  .stars-sm{
    gap:3px;
    margin:0;
  }
  .stars-sm .star{
    font-size:1.4rem;
  }
  .section-hint{
    font-size:0.78rem;
    color:var(--ink-soft);
    text-align:center;
    margin-top:8px;
  }
  .submit-btn{
    width:100%;
    background:var(--pink-hot);
    color:var(--white);
    border:none;
    border-radius:16px;
    padding:15px;
    font-size:1.05rem;
    font-weight:700;
    font-family:inherit;
    cursor:pointer;
    box-shadow:var(--shadow);
    margin-top:8px;
  }
  .submit-btn:disabled{opacity:0.6; cursor:not-allowed;}
  .error{color:#c0025e; font-size:0.8rem; margin-top:8px; display:none;}
  .hidden{display:none;}
  .success-screen{
    max-width:420px;
    margin:60px auto 0;
    text-align:center;
    padding:0 20px;
  }
  .success-screen .emoji{font-size:3rem;}
  .success-screen h2{
    font-family:'Baloo 2', cursive;
    font-weight:800;
    color:#e20376;
    font-size:1.7rem;
  }
  .success-screen p{color:var(--ink-soft); font-size:0.95rem; line-height:1.5;}
  .footer-note{text-align:center; font-size:0.8rem; color:var(--ink-soft); margin-top:18px;}
  .back-link{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:var(--white);
    color:#e20376;
    border:1.5px solid var(--pink-hot);
    border-radius:16px;
    padding:10px 18px;
    text-decoration:none;
    font-weight:700;
    font-size:0.9rem;
    margin-bottom:14px;
    box-shadow:var(--shadow);
  }
  .back-link:hover{background:var(--pink-hot); color:var(--white);}

  .hero-star-accent{
    position:absolute; width:26px; height:26px;
    animation:starSpin 7s linear infinite;
  }
  @keyframes starSpin{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }
  @media (prefers-reduced-motion: reduce){ .hero-star-accent{animation:none;} }

  .sticker-star{
    position:absolute; pointer-events:none; z-index:2;
    filter:drop-shadow(0 3px 5px rgba(58,36,48,0.25));
  }
  .sticker-gem{
    position:absolute; pointer-events:none; z-index:2;
    filter:drop-shadow(0 3px 5px rgba(58,36,48,0.25));
    animation:gem-pulse 3s ease-in-out infinite;
  }
  @keyframes gem-pulse{ 0%,100%{opacity:0.85; transform:scale(1);} 50%{opacity:1; transform:scale(1.06);} }
  @media (prefers-reduced-motion: reduce){ .sticker-gem{animation:none;} }

  .sparkle{
    position:absolute; color:#c8912f; pointer-events:none; z-index:2;
    text-shadow:0 0 6px #fff, 0 0 10px #ff6fb0;
    animation:sparkle-twinkle 2.2s ease-in-out infinite;
  }
  @keyframes sparkle-twinkle{ 0%,100%{opacity:0.25; transform:scale(0.8);} 50%{opacity:1; transform:scale(1.15);} }
  .sparkle.drift{ animation:sparkle-drift 6s ease-in infinite, sparkle-twinkle 1.8s ease-in-out infinite; }
  @keyframes sparkle-drift{
    0%{transform:translateY(0) translateX(0) rotate(0deg); opacity:0;}
    10%{opacity:1;} 90%{opacity:0.8;}
    100%{transform:translateY(-90px) translateX(10px) rotate(25deg); opacity:0;}
  }
  .sparkle.sway{ animation:sparkle-sway 4.5s ease-in-out infinite; }
  @keyframes sparkle-sway{ 0%,100%{transform:translateX(0) rotate(-8deg); opacity:0.5;} 50%{transform:translateX(8px) rotate(8deg); opacity:1;} }
  @media (prefers-reduced-motion: reduce){ .sparkle{animation:none !important; opacity:0.5;} }
</style>
</head>
<body>

<svg style="display:none;">
  <symbol id="stickerStarShape" viewBox="0 0 100 100">
    <path d="M50 4 L61 36 L96 36 L67 56 L78 90 L50 70 L22 90 L33 56 L4 36 L39 36 Z" fill="currentColor" stroke="#fff" stroke-width="4"/>
  </symbol>
  <symbol id="gemHeartShape" viewBox="0 0 100 90">
    <path d="M50 88 C20 62 4 42 4 24 C4 8 16 0 30 0 C40 0 47 6 50 14 C53 6 60 0 70 0 C84 0 96 8 96 24 C96 42 80 62 50 88 Z" fill="currentColor" stroke="#fff" stroke-width="4"/>
    <path d="M50 14 L50 82 M20 30 L80 30" stroke="#fff" stroke-width="1.5" opacity="0.5"/>
  </symbol>
</svg>


<div class="banner">

  <img src="assets/logo.png" alt="Mel's Treat" class="banner-logo">
  <h1 style="position:relative; display:inline-block;">Leave A Review 💕
    <svg class="hero-star-accent" viewBox="0 0 100 100" style="top:-16px; right:-24px;" aria-hidden="true">
      <defs>
        <linearGradient id="starGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#ff8fc4"/>
          <stop offset="55%" stop-color="#e20376"/>
          <stop offset="100%" stop-color="#a8025f"/>
        </linearGradient>
      </defs>
      <path d="M50 2 L61 38 L98 38 L68 60 L79 96 L50 74 L21 96 L32 60 L2 38 L39 38 Z" fill="url(#starGrad1)" stroke="#fff" stroke-width="2"/>
      <ellipse cx="40" cy="30" rx="9" ry="5" fill="#ffffff" opacity="0.55" transform="rotate(-30 40 30)"/>
    </svg></h1>
  <div class="sub">I'd love to hear how your treats turned out!</div>
</div>

<div class="container">
  <a href="https://ordertreats.melstreat.com/" class="back-link" id="back-link" onclick="return smartBack(event, 'https://ordertreats.melstreat.com/')">← Back</a>

  <form id="review-form" class="card">
    <label>Your Rating *</label>
    <div class="stars" data-group="overall">
      <button type="button" class="star" data-value="1">★</button>
      <button type="button" class="star" data-value="2">★</button>
      <button type="button" class="star" data-value="3">★</button>
      <button type="button" class="star" data-value="4">★</button>
      <button type="button" class="star" data-value="5">★</button>
    </div>
    <div class="rating-label" data-label-for="overall">Tap a star to rate</div>

    <div class="subrating-grid">
      <div class="subrating-item">
        <label class="subrating-label">Taste</label>
        <div class="stars stars-sm" data-group="taste">
          <button type="button" class="star" data-value="1">★</button>
          <button type="button" class="star" data-value="2">★</button>
          <button type="button" class="star" data-value="3">★</button>
          <button type="button" class="star" data-value="4">★</button>
          <button type="button" class="star" data-value="5">★</button>
        </div>
      </div>
      <div class="subrating-item">
        <label class="subrating-label">Packaging</label>
        <div class="stars stars-sm" data-group="packaging">
          <button type="button" class="star" data-value="1">★</button>
          <button type="button" class="star" data-value="2">★</button>
          <button type="button" class="star" data-value="3">★</button>
          <button type="button" class="star" data-value="4">★</button>
          <button type="button" class="star" data-value="5">★</button>
        </div>
      </div>
      <div class="subrating-item">
        <label class="subrating-label">Communication</label>
        <div class="stars stars-sm" data-group="communication">
          <button type="button" class="star" data-value="1">★</button>
          <button type="button" class="star" data-value="2">★</button>
          <button type="button" class="star" data-value="3">★</button>
          <button type="button" class="star" data-value="4">★</button>
          <button type="button" class="star" data-value="5">★</button>
        </div>
      </div>
    </div>
    <div class="section-hint">Taste, packaging, and communication are optional — rate whatever feels relevant!</div>

    <label for="customer_name">Your Name *</label>
    <input type="text" id="customer_name" placeholder="Jane Doe" required />

    <label for="order_reference">What Did You Order? (optional)</label>
    <input type="text" id="order_reference" placeholder="e.g. 6-Count Box, Red Velvet + S'mores" />

    <label for="review_text">Your Review</label>
    <textarea id="review_text" placeholder="Tell me what you thought! ♡"></textarea>

    <div id="form-error" class="error"></div>
    <button type="submit" class="submit-btn" id="submit-btn">Submit Review</button>
  </form>


  <div class="footer-note">🍪 Baked With Love 🎀</div>
</div>

<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script defer>
function smartBack(e, fallbackUrl) {
  e.preventDefault();
  var navigatedAway = false;
  var markNavigated = function(){ navigatedAway = true; };
  window.addEventListener('pagehide', markNavigated, { once: true });
  history.back();
  setTimeout(function() {
    window.removeEventListener('pagehide', markNavigated);
    if (!navigatedAway) {
      window.location.href = fallbackUrl;
    }
  }, 800);
  return false;
}

const SUPABASE_URL = 'https://wgicnbaoqsekageoygea.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndnaWNuYmFvcXNla2FnZW95Z2VhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0NjU1OTAsImV4cCI6MjEwMTA0MTU5MH0.2GvmyU0sB2tlNCqRpTY4Gnr8bB57ngoR_lQHm7g6au4';

let _supabaseClient = null;
async function waitForSupabase(timeoutMs) {
  const start = Date.now();
  while (!window.supabase) {
    if (Date.now() - start > timeoutMs) return false;
    await new Promise(r => setTimeout(r, 100));
  }
  return true;
}

async function getSupabase() {
  if (!_supabaseClient) {
    const loaded = await waitForSupabase(6000);
    if (!loaded) {
      throw new Error('Could not connect to the order system. Please check your connection and try again.');
    }
    _supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }
  return _supabaseClient;
}

const ratings = { overall: 0, taste: 0, packaging: 0, communication: 0 };
const labels = ['Tap a star to rate', 'Not great', 'Okay', 'Good', 'Great!', 'Loved it! 💕'];

document.querySelectorAll('.stars').forEach(row => {
  const group = row.dataset.group;
  const starButtons = row.querySelectorAll('.star');
  const label = document.querySelector(`[data-label-for="${group}"]`);

  row.addEventListener('click', (e) => {
    const btn = e.target.closest('.star');
    if (!btn) return;
    const value = parseInt(btn.dataset.value);
    ratings[group] = value;
    starButtons.forEach(s => s.classList.toggle('filled', parseInt(s.dataset.value) <= value));
    if (label) label.textContent = labels[value];
  });
});

const form = document.getElementById('review-form');
const errorBox = document.getElementById('form-error');
const submitBtn = document.getElementById('submit-btn');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorBox.style.display = 'none';

  const customer_name = document.getElementById('customer_name').value.trim();
  if (!customer_name) {
    errorBox.textContent = 'Please enter your name.';
    errorBox.style.display = 'block';
    return;
  }
  if (ratings.overall === 0) {
    errorBox.textContent = 'Please tap a star to leave an overall rating.';
    errorBox.style.display = 'block';
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = 'Submitting...';

  try {
    const supabase = await getSupabase();
    const reviewRow = {
      customer_name,
      rating: ratings.overall,
      taste_rating: ratings.taste || null,
      packaging_rating: ratings.packaging || null,
      communication_rating: ratings.communication || null,
      review_text: document.getElementById('review_text').value.trim() || null,
      order_reference: document.getElementById('order_reference').value.trim() || null,
    };

    const { error } = await supabase.from('reviews').insert(reviewRow);
    if (error) throw error;

    try {
      await supabase.functions.invoke('send-review-email', { body: reviewRow });
    } catch (emailErr) {
      console.error('Email notification failed (review was still saved):', emailErr);
    }

    window.location.href = 'review-thankyou.html';
  } catch (err) {
    console.error(err);
    errorBox.textContent = 'Something went wrong submitting your review. Please try again: ' + (err.message || '');
    errorBox.style.display = 'block';
    submitBtn.disabled = false;
    submitBtn.textContent = 'Submit Review';
  }
});

function scatterPageAccents() {
  const sectionSelectors = ['.banner', '.card'];
  const sections = sectionSelectors
    .map(sel => Array.from(document.querySelectorAll(sel)).find(el => el.offsetParent !== null))
    .filter(Boolean);
  if (sections.length === 0) return;

  const glyphs = ['✦', '✧', '✨', '♥', '⋆'];
  const anims = ['', 'drift', 'sway'];
  const starColors = ['#c8912f', '#e20376'];

  function buildFor(section, sparkleN, starN, heartN) {
    const rect = section.getBoundingClientRect();
    const height = Math.max(rect.height, 80);
    const width = Math.max(rect.width, 200);
    const placed = [];
    const entries = [];

    function findSpot(radius, excludeEntry) {
      for (let attempt = 0; attempt < 12; attempt++) {
        const topPx = Math.random() * height;
        const leftPercent = Math.random() * 100;
        const leftPx = (leftPercent / 100) * width;
        const collides = placed.some(p => {
          if (p === excludeEntry) return false;
          const dx = p.leftPx - leftPx;
          const dy = p.topPx - topPx;
          const minDist = p.radius + radius + 16;
          return (dx * dx + dy * dy) < (minDist * minDist);
        });
        if (!collides) return { topPx, leftPercent, leftPx };
      }
      return null;
    }

    function scheduleWander(entry) {
      const waitMs = 5000 + Math.random() * 6000;
      setTimeout(() => {
        entry.el.style.animationPlayState = 'paused';
        entry.el.style.transition = 'opacity 0.6s ease';
        entry.el.style.opacity = '0';
        setTimeout(() => {
          const spot = findSpot(entry.radius, entry);
          if (spot) {
            entry.el.style.top = spot.topPx + 'px';
            entry.el.style.left = spot.leftPercent + '%';
            Object.assign(entry, spot);
            const i = placed.indexOf(entry);
            if (i >= 0) placed[i] = entry;
          }
          entry.el.style.opacity = '1';
          setTimeout(() => { entry.el.style.animationPlayState = 'running'; }, 650);
          scheduleWander(entry);
        }, 650);
      }, waitMs);
    }

    const wrap = document.createElement('div');
    wrap.style.cssText = 'position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0; overflow:hidden;';

    for (let i = 0; i < sparkleN; i++) {
      const size = 9 + Math.random() * 12;
      const radius = size * 0.6;
      const spot = findSpot(radius);
      if (!spot) continue;
      const el = document.createElement('span');
      const glyph = glyphs[Math.floor(Math.random() * glyphs.length)];
      const anim = anims[Math.floor(Math.random() * anims.length)];
      el.className = `sparkle ${anim}`;
      el.style.cssText = `top:${spot.topPx}px; left:${spot.leftPercent}%; font-size:${size}px; animation-delay:${Math.random() * 4}s;`;
      el.textContent = glyph;
      wrap.appendChild(el);
      const entry = { ...spot, radius, el };
      placed.push(entry); entries.push(entry);
    }

    for (let i = 0; i < starN; i++) {
      const size = 15 + Math.random() * 8;
      const radius = size * 0.6;
      const spot = findSpot(radius);
      if (!spot) continue;
      const el = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      el.setAttribute('viewBox', '0 0 100 100');
      const rotate = Math.random() * 30 - 15;
      const duration = 6 + Math.random() * 4;
      const color = starColors[Math.floor(Math.random() * starColors.length)];
      el.style.cssText = `position:absolute; top:${spot.topPx}px; left:${spot.leftPercent}%; width:${size}px; height:${size}px; color:${color}; filter:drop-shadow(0 2px 4px rgba(58,36,48,0.2)); animation:starSpin ${duration}s linear infinite; transform:rotate(${rotate}deg);`;
      el.innerHTML = '<path d="M50 2 L61 38 L98 38 L68 60 L79 96 L50 74 L21 96 L32 60 L2 38 L39 38 Z" fill="currentColor" stroke="#fff" stroke-width="3"/>';
      wrap.appendChild(el);
      const entry = { ...spot, radius, el };
      placed.push(entry); entries.push(entry);
    }

    for (let i = 0; i < heartN; i++) {
      const size = 13 + Math.random() * 7;
      const radius = size * 0.6;
      const spot = findSpot(radius);
      if (!spot) continue;
      const el = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      el.setAttribute('class', 'sticker-gem');
      el.setAttribute('viewBox', '0 0 100 90');
      const rotate = Math.random() * 20 - 10;
      el.style.cssText = `position:absolute; top:${spot.topPx}px; left:${spot.leftPercent}%; width:${size}px; height:${size * 0.9}px; color:#ff8fc4; transform:rotate(${rotate}deg);`;
      el.innerHTML = '<use href="#gemHeartShape"/>';
      wrap.appendChild(el);
      const entry = { ...spot, radius, el };
      placed.push(entry); entries.push(entry);
    }

    if (getComputedStyle(section).position === 'static') section.style.position = 'relative';
    section.insertBefore(wrap, section.firstChild);
    entries.forEach(scheduleWander);
  }

  const heights = sections.map(s => Math.max(s.getBoundingClientRect().height, 80));
  const totalH = heights.reduce((a, b) => a + b, 0);
  sections.forEach((section, i) => {
    const share = heights[i] / totalH;
    buildFor(
      section,
      Math.round(22 * share),
      i === 0 ? 2 : 0,
      i === sections.length - 1 ? 2 : 0
    );
  });
}

window.addEventListener('load', () => {
  setTimeout(() => scatterPageAccents(), 300);
});
</script>

</body>
</html>
