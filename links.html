<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mel's Treats – Links</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Pacifico&display=swap" rel="stylesheet">
<style>
  :root{
    --pink-light:#fedde4;
    --pink-hot:#e20376;
    --white:#ffffff;
    --ink:#3a2430;
    --ink-soft:#8a6b78;
    --border:#f7c3d6;
    --shadow: 0 6px 20px rgba(226,3,118,0.10);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--pink-light);
    font-family:'Quicksand', sans-serif;
    color:var(--ink);
    padding-bottom:60px;
  }
  .banner{
    background:linear-gradient(135deg, var(--pink-hot), #ff5fa8);
    padding:48px 20px 56px;
    text-align:center;
    color:var(--white);
    border-radius:0 0 32px 32px;
    box-shadow:var(--shadow);
  }
  .banner h1{
    font-family:'Pacifico', cursive;
    font-size:2.4rem;
    margin:0 0 6px;
    letter-spacing:0.5px;
  }
  .banner .sub{
    font-size:1.05rem;
    max-width:480px;
    margin:0 auto;
    opacity:0.96;
  }
  .container{
    max-width:480px;
    margin:-28px auto 0;
    padding:0 16px;
  }
  .card{
    background:var(--white);
    border-radius:22px;
    padding:22px 20px;
    margin-bottom:18px;
    box-shadow:var(--shadow);
    border:1px solid var(--border);
  }
  .section-note{
    font-size:0.88rem;
    color:var(--ink-soft);
    margin:0 0 14px;
    text-align:center;
  }
  .payment-link-box{
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--white);
    border:1.5px solid var(--border);
    border-radius:12px;
    padding:12px 16px;
    text-decoration:none;
    color:var(--ink);
    transition:0.15s;
  }
  .payment-link-box:hover{
    border-color:var(--pink-hot);
    background:#fff5f8;
  }
  .payment-link-box .pay-icon{font-size:1.4rem;}
  .payment-link-box .pay-label{
    display:block;
    font-weight:700;
    font-size:0.94rem;
    color:var(--pink-hot);
  }
  .payment-link-box .pay-handle{
    display:block;
    font-size:0.82rem;
    color:var(--ink-soft);
  }
  .back-btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:var(--white);
    color:var(--pink-hot);
    border:1.5px solid var(--pink-hot);
    border-radius:16px;
    padding:12px 20px;
    font-family:inherit;
    font-weight:700;
    font-size:0.95rem;
    text-decoration:none;
    cursor:pointer;
  }
  .back-btn:hover{background:var(--pink-light);}
  .back-wrap{text-align:center; margin-top:6px;}
  .footer-note{
    text-align:center;
    font-size:0.8rem;
    color:var(--ink-soft);
    margin-top:18px;
  }
</style>
</head>
<body>

<div class="banner">
  <h1>Mel's Treats</h1>
  <div class="sub">Baked With Love · Follow Along 💕</div>
</div>

<div class="container">
  <div class="card">
    <p class="section-note">Everywhere you can find me ✨</p>
    <div style="display:flex; flex-direction:column; gap:10px;">
      <a href="https://www.instagram.com/melstreat23" target="_blank" rel="noopener" class="payment-link-box">
        <span class="pay-icon">📸</span>
        <span><span class="pay-label">Instagram</span><span class="pay-handle">@melstreat23</span></span>
      </a>
      <a href="https://www.tiktok.com/@meltreat23" target="_blank" rel="noopener" class="payment-link-box">
        <span class="pay-icon">🎵</span>
        <span><span class="pay-label">TikTok</span><span class="pay-handle">@meltreat23</span></span>
      </a>
      <a href="faq.html" class="payment-link-box">
        <span class="pay-icon">💬</span>
        <span><span class="pay-label">FAQ</span><span class="pay-handle">Answers To Sweet Questions</span></span>
      </a>
      <a href="index.html" class="payment-link-box">
        <span class="pay-icon">🍪</span>
        <span><span class="pay-label">Order Cookies</span><span class="pay-handle">Place Your Order</span></span>
      </a>
    </div>
  </div>

  <div class="back-wrap">
    <a href="index.html" class="back-btn">← Back To Site</a>
  </div>

  <div class="footer-note">🍪 Baked With Love 🎀</div>
</div>

</body>
</html>
