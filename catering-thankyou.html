<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#fedde4" />
<title>Thank You – Mel's Treat</title>
<link rel="icon" type="image/png" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Pacifico&display=swap" rel="stylesheet">
<style>
  :root{
    --pink-light:#fedde4;
    --pink-hot:#e20376;
    --white:#ffffff;
    --ink:#3a2430;
    --ink-soft:#8a6b78;
    --border:#f7c3d6;
    --shadow: 0 6px 20px rgba(226,3,118,0.10);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--pink-light);
    font-family:'Quicksand', sans-serif;
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px 16px;
  }
  .card{
    background:var(--white);
    border-radius:22px;
    padding:40px 28px;
    max-width:420px;
    text-align:center;
    box-shadow:var(--shadow);
    border:1px solid var(--border);
  }
  .logo{
    width:90px;
    height:90px;
    border-radius:50%;
    object-fit:cover;
    margin-bottom:16px;
    box-shadow:0 4px 14px rgba(0,0,0,0.15);
  }
  .emoji{font-size:2.6rem; margin-bottom:6px;}
  h1{
    font-family:'Pacifico', cursive;
    color:var(--pink-hot);
    font-size:1.8rem;
    margin:0 0 12px;
  }
  p{
    color:var(--ink-soft);
    font-size:0.95rem;
    line-height:1.5;
    margin:0 0 24px;
  }
  .back-btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:var(--white);
    color:var(--pink-hot);
    border:1.5px solid var(--pink-hot);
    border-radius:16px;
    padding:12px 20px;
    font-family:inherit;
    font-weight:700;
    font-size:0.95rem;
    text-decoration:none;
  }
  .back-btn:hover{background:var(--pink-light);}
</style>
</head>
<body>

<div class="card">
  <img src="assets/logo.png" alt="Mel's Treat" class="logo">
  <div class="emoji">🎉</div>
  <h1>Request Received!</h1>
  <p>Thank you for your catering request! I'll review the details and reach out soon to confirm everything, including your final pricing. Can't wait to make your event sweeter! 💕</p>
  <a href="https://ordertreats.melstreat.com/" class="back-btn">← Back To Site</a>
</div>

</body>
</html>
