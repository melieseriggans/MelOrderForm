<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#fedde4" />
<title>Reviews – Mel's Treat</title>
<link rel="icon" type="image/png" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Pacifico&display=swap" rel="stylesheet">
<style>
  :root{
    --pink-light:#fedde4;
    --pink-hot:#e20376;
    --white:#ffffff;
    --ink:#3a2430;
    --ink-soft:#8a6b78;
    --border:#f7c3d6;
    --shadow: 0 6px 20px rgba(226,3,118,0.10);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--pink-light);
    font-family:'Quicksand', sans-serif;
    color:var(--ink);
    padding-bottom:60px;
  }
  .banner{
    background:linear-gradient(135deg, var(--pink-hot), #ff5fa8);
    padding:44px 20px 52px;
    text-align:center;
    color:var(--white);
    border-radius:0 0 32px 32px;
    box-shadow:var(--shadow);
  }
  .banner-logo{
    width:80px;
    height:80px;
    border-radius:50%;
    object-fit:cover;
    margin-bottom:10px;
    box-shadow:0 4px 14px rgba(0,0,0,0.15);
  }
  .banner h1{
    font-family:'Pacifico', cursive;
    font-size:2.2rem;
    margin:0 0 6px;
  }
  .banner .sub{
    font-size:1rem;
    max-width:420px;
    margin:0 auto;
    opacity:0.96;
  }
  .container{
    max-width:560px;
    margin:-26px auto 0;
    padding:0 16px;
  }
  .summary-card{
    background:var(--white);
    border-radius:22px;
    padding:22px 20px;
    margin-bottom:18px;
    box-shadow:var(--shadow);
    border:1px solid var(--border);
    text-align:center;
  }
  .summary-score{
    font-family:'Pacifico', cursive;
    color:var(--pink-hot);
    font-size:2.6rem;
    line-height:1;
  }
  .summary-stars{
    color:var(--pink-hot);
    font-size:1.4rem;
    letter-spacing:2px;
    margin:6px 0;
  }
  .summary-count{
    font-size:0.85rem;
    color:var(--ink-soft);
  }
  .review-card{
    background:var(--white);
    border-radius:20px;
    padding:18px 20px;
    margin-bottom:14px;
    box-shadow:var(--shadow);
    border:1px solid var(--border);
    text-align:left;
  }
  .review-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:6px;
  }
  .review-name{font-weight:700; font-size:0.95rem;}
  .review-stars{color:var(--pink-hot); font-size:1.05rem; letter-spacing:1px;}
  .review-order{
    font-size:0.78rem;
    color:var(--ink-soft);
    margin-bottom:8px;
  }
  .review-text{
    font-size:0.92rem;
    color:var(--ink);
    line-height:1.5;
  }
  .sub-ratings{
    display:flex;
    gap:14px;
    flex-wrap:wrap;
    margin-top:10px;
    padding-top:10px;
    border-top:1px solid var(--pink-light);
    font-size:0.76rem;
    color:var(--ink-soft);
  }
  .sub-ratings span b{color:var(--pink-hot);}
  .empty-state{
    text-align:center;
    color:var(--ink-soft);
    font-size:0.92rem;
    padding:30px 20px;
  }
  .footer-note{text-align:center; font-size:0.8rem; color:var(--ink-soft); margin-top:18px;}
  .back-link{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:var(--white);
    color:var(--pink-hot);
    border:1.5px solid var(--pink-hot);
    border-radius:16px;
    padding:10px 18px;
    text-decoration:none;
    font-weight:700;
    font-size:0.9rem;
    margin-bottom:14px;
    box-shadow:var(--shadow);
  }
  .back-link:hover{background:var(--pink-hot); color:var(--white);}
  .leave-review-btn{
    display:block;
    text-align:center;
    background:var(--pink-hot);
    color:var(--white);
    text-decoration:none;
    font-weight:700;
    font-size:1rem;
    padding:15px;
    border-radius:16px;
    box-shadow:var(--shadow);
    margin-top:20px;
  }
  .leave-review-btn:hover{background:#b8025f;}
</style>
</head>
<body>

<div class="banner">
  <img src="assets/logo.png" alt="Mel's Treat" class="banner-logo">
  <h1>Sweet Reviews 💕</h1>
  <div class="sub">What My Customers Are Saying</div>
</div>

<div class="container">
  <a href="https://ordertreats.melstreat.com/" class="back-link" onclick="if(window.history.length > 1){history.back(); return false;}">← Back</a>

  <div class="summary-card" id="summary-card">
    <div class="summary-score" id="summary-score">—</div>
    <div class="summary-stars" id="summary-stars"></div>
    <div class="summary-count" id="summary-count">Loading reviews…</div>
  </div>

  <div id="review-list"></div>

  <a href="reviews.html" class="leave-review-btn">Leave A Review 💕</a>

  <div class="footer-note">🍪 Baked With Love 🎀</div>
</div>

<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script defer>
const SUPABASE_URL = 'https://wgicnbaoqsekageoygea.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndnaWNuYmFvcXNla2FnZW95Z2VhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0NjU1OTAsImV4cCI6MjEwMTA0MTU5MH0.2GvmyU0sB2tlNCqRpTY4Gnr8bB57ngoR_lQHm7g6au4';

function starString(n){
  return '★★★★★☆☆☆☆☆'.slice(5 - n, 10 - n);
}

async function waitForSupabase(timeoutMs){
  const start = Date.now();
  while (!window.supabase) {
    if (Date.now() - start > timeoutMs) return false;
    await new Promise(r => setTimeout(r, 100));
  }
  return true;
}

async function loadReviews(){
  const summaryScore = document.getElementById('summary-score');
  const summaryStars = document.getElementById('summary-stars');
  const summaryCount = document.getElementById('summary-count');
  const list = document.getElementById('review-list');

  try {
    const loaded = await waitForSupabase(6000);
    if (!loaded) throw new Error('The database library did not load after 6 seconds. This may be a slow connection, or your network/browser is blocking cdn.jsdelivr.net.');
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const { data, error } = await supabase
      .from('reviews')
      .select('customer_name, rating, taste_rating, packaging_rating, communication_rating, review_text, order_reference, created_at')
      .eq('approved', true)
      .order('created_at', { ascending: false });

    if (error) throw error;

    if (!data || data.length === 0) {
      summaryScore.textContent = '—';
      summaryStars.textContent = '';
      summaryCount.textContent = 'No reviews yet — be the first!';
      list.innerHTML = '';
      return;
    }

    const avg = data.reduce((sum, r) => sum + r.rating, 0) / data.length;
    summaryScore.textContent = avg.toFixed(1);
    summaryStars.textContent = starString(Math.round(avg));
    summaryCount.textContent = `Based on ${data.length} review${data.length === 1 ? '' : 's'}`;

    list.innerHTML = data.map(r => {
      const subParts = [];
      if (r.taste_rating) subParts.push(`<span>Taste: <b>${r.taste_rating}★</b></span>`);
      if (r.packaging_rating) subParts.push(`<span>Packaging: <b>${r.packaging_rating}★</b></span>`);
      if (r.communication_rating) subParts.push(`<span>Communication: <b>${r.communication_rating}★</b></span>`);
      const subRow = subParts.length ? `<div class="sub-ratings">${subParts.join('')}</div>` : '';
      const orderRow = r.order_reference ? `<div class="review-order">Ordered: ${escapeHtml(r.order_reference)}</div>` : '';
      const textRow = r.review_text ? `<div class="review-text">${escapeHtml(r.review_text)}</div>` : '';
      return `
        <div class="review-card">
          <div class="review-top">
            <span class="review-name">${escapeHtml(r.customer_name)}</span>
            <span class="review-stars">${starString(r.rating)}</span>
          </div>
          ${orderRow}
          ${textRow}
          ${subRow}
        </div>
      `;
    }).join('');
  } catch (err) {
    console.error(err);
    summaryCount.textContent = 'Could not load reviews: ' + (err && err.message ? err.message : String(err));
  }
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

loadReviews();
</script>

</body>
</html>
