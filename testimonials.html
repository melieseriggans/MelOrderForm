<style>
  :root{
    --blush:#fedde4; --pink-mid:#ffcfe0; --pink-hot:#e20376; --pink-deep:#a8025f; --pink-glow:#ff6fb0;
    --plum:#7a0146; --plum-deep:#4d022c; --gold:#c8912f; --gold-light:#f8e8c8;
    --ink:#3a2430; --ink-soft:#8a6b78; --cream:#fffaf6; --white:#ffffff; --border:#f7c3d6;
    --shadow: 0 6px 20px rgba(226,3,118,0.10); --shadow-lift: 0 16px 36px rgba(226,3,118,0.20);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    position:relative;margin:0; background:var(--blush); font-family:'Quicksand', sans-serif; color:var(--ink);
    background-image: linear-gradient(rgba(254,221,228,0.6), rgba(254,221,228,0.6)), url('assets/about-leopard-recolor.jpg');
    background-size: cover, 200px auto;
    background-attachment: fixed, fixed;
  }
  a{color:inherit;}

  .seal{position:relative; display:inline-block; border-radius:50%;}

  .top-nav{position:sticky; top:0; z-index:50; background:rgba(255,255,255,0.94); backdrop-filter:blur(10px); border-bottom:1px solid var(--border);}
  .nav-inner{max-width:1100px; margin:0 auto; padding:10px 14px; display:flex; justify-content:space-between; align-items:center; gap:8px;}
  .nav-brand{display:flex; align-items:center; gap:8px; text-decoration:none; flex-shrink:0;}
  .nav-brand img{width:52px; height:52px; object-fit:cover;}
  .nav-brand .wordmark{font-family:'Fredoka', sans-serif; font-weight:700; color:var(--ink); font-size:1.05rem; display:none;}
  @media (min-width: 480px){ .nav-brand .wordmark{display:inline;} }
  .nav-links{display:flex; align-items:center; gap:9px; flex-wrap:wrap; justify-content:flex-end;}
  .nav-links a:not(.nav-back-btn){text-decoration:none; font-weight:600; font-size:0.78rem; color:var(--ink-soft); transition:color 0.15s; white-space:nowrap;}
  .nav-links a:not(.nav-back-btn):hover{color:var(--pink-hot);}
  .nav-links .desktop-link{display:inline;}
  .nav-back-btn{
    background:var(--blush); border:none; width:30px; height:30px; border-radius:50%;
    font-size:0.95rem; color:var(--pink-hot); cursor:pointer; text-decoration:none; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  .nav-back{text-decoration:none; font-weight:600; font-size:0.85rem; color:var(--ink-soft);}
  .nav-back:hover{color:#e20376;}

  .hero{
    width:calc(100% - 40px); max-width:520px; margin:0 auto; padding:26px 24px; text-align:center; position:relative;
    background:var(--white); border-radius:22px 22px 0 0; box-shadow:var(--shadow); border:1.5px solid var(--border); border-bottom:none;
    box-sizing:border-box;
  }
  .sparkle{
    position:absolute; color:#c8912f; pointer-events:none; z-index:2;
    text-shadow:0 0 6px #fff, 0 0 10px var(--pink-glow);
    animation:sparkle-twinkle 2.2s ease-in-out infinite;
  }
  @keyframes sparkle-twinkle{ 0%,100%{opacity:0.25; transform:scale(0.8);} 50%{opacity:1; transform:scale(1.15);} }
  .sparkle.drift{ animation:sparkle-drift 6s ease-in infinite, sparkle-twinkle 1.8s ease-in-out infinite; }
  @keyframes sparkle-drift{
    0%{transform:translateY(0) translateX(0) rotate(0deg); opacity:0;}
    10%{opacity:1;} 90%{opacity:0.8;}
    100%{transform:translateY(-90px) translateX(10px) rotate(25deg); opacity:0;}
  }
  .sparkle.sway{ animation:sparkle-sway 4.5s ease-in-out infinite; }
  @keyframes sparkle-sway{ 0%,100%{transform:translateX(0) rotate(-8deg); opacity:0.5;} 50%{transform:translateX(8px) rotate(8deg); opacity:1;} }
  @media (prefers-reduced-motion: reduce){ .sparkle{animation:none !important; opacity:0.5;} }
  .eyebrow{
    display:flex; align-items:center; justify-content:center; gap:8px;
    width:fit-content; margin:0 auto 10px;
    font-family:'Fredoka', sans-serif; font-size:0.76rem;
    font-weight:600; color:#e20376; letter-spacing:1.2px; text-transform:uppercase;
  }
  .eyebrow::before, .eyebrow::after{content:'✦'; color:#c8912f; font-size:0.65rem;}
  h1{font-family:'Fredoka', sans-serif; font-weight:700; font-size:clamp(1.9rem, 5.6vw, 2.5rem); color:#e20376; margin:0 0 8px; -webkit-text-stroke:1px var(--white); text-shadow:1.5px 1.5px 0 var(--white), -1px -1px 0 var(--white), 0 0 14px var(--pink-glow);}
  .hero-sub{font-size:0.96rem; color:var(--ink-soft); max-width:400px; margin:0 auto; line-height:1.6;}

  .container{max-width:560px; margin:0 auto; padding:0 20px 40px;}

  .summary-card{
    background:var(--white); border-radius:0 0 22px 22px; padding:26px 22px; margin-bottom:0;
    box-shadow:var(--shadow); border:1.5px solid var(--border); border-top:none; text-align:center;
  }
  .summary-score{font-family:'Fredoka', sans-serif; font-weight:700; color:#e20376; font-size:2.6rem; line-height:1;}
  .summary-stars{color:#c8912f; font-size:1.3rem; letter-spacing:3px; margin:8px 0;}
  .summary-count{font-size:0.85rem; color:var(--ink-soft);}

  #review-list{margin-top:18px;}
  .review-card{
    background:var(--white); border-radius:18px; padding:18px 20px; margin-bottom:12px;
    box-shadow:var(--shadow); border:1.5px solid var(--border); text-align:left; transition:transform 0.15s;
  }
  .review-card:hover{transform:translateY(-2px);}
  .review-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; gap:8px;}
  .review-name{font-family:'Fredoka', sans-serif; font-weight:700; font-size:0.92rem;}
  .review-stars{color:#c8912f; font-size:1rem; letter-spacing:1px; flex-shrink:0;}
  .review-order{font-size:0.76rem; color:var(--ink-soft); margin-bottom:8px;}
  .review-text{font-size:0.9rem; color:var(--ink); line-height:1.55;}
  .sub-ratings{
    display:flex; gap:14px; flex-wrap:wrap; margin-top:10px; padding-top:10px;
    border-top:1px solid var(--blush); font-size:0.74rem; color:var(--ink-soft);
  }
  .sub-ratings span b{color:#e20376;}

  .empty-state{text-align:center; color:var(--ink-soft); font-size:0.92rem; padding:30px 20px;}
  .footer-note{text-align:center; font-size:0.8rem; color:var(--ink-soft); margin-top:22px;}

  .leave-review-btn{
    display:block; text-align:center; text-decoration:none; margin-top:22px;
    background:linear-gradient(180deg, var(--pink-glow), var(--pink-hot)); color:var(--white);
    font-family:'Fredoka', sans-serif; font-weight:600; font-size:0.98rem; padding:16px;
    border-radius:16px; box-shadow:inset 0 2px 3px rgba(255,255,255,0.45), var(--shadow);
    transition:transform 0.15s;
  }
  .leave-review-btn:hover{transform:translateY(-2px); box-shadow:inset 0 2px 3px rgba(255,255,255,0.45), var(--shadow-lift);}

  .hero-star-accent{
    position:absolute; width:26px; height:26px;
    animation:starSpin 7s linear infinite;
  }
  @keyframes starSpin{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }
  @media (prefers-reduced-motion: reduce){ .hero-star-accent{animation:none;} }

  .sticker-star{
    position:absolute; pointer-events:none; z-index:2;
    filter:drop-shadow(0 3px 5px rgba(58,36,48,0.25));
  }
  .sticker-gem{
    position:absolute; pointer-events:none; z-index:2;
    filter:drop-shadow(0 3px 5px rgba(58,36,48,0.25));
    animation:gem-pulse 3s ease-in-out infinite;
  }
  @keyframes gem-pulse{ 0%,100%{opacity:0.85; transform:scale(1);} 50%{opacity:1; transform:scale(1.06);} }
  @media (prefers-reduced-motion: reduce){ .sticker-gem{animation:none;} }
</style>
</head>

    <svg class="hero-star-accent" viewBox="0 0 100 100" style="top:-16px; right:-24px;" aria-hidden="true">

<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script defer>
const SUPABASE_URL = 'https://wgicnbaoqsekageoygea.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndnaWNuYmFvcXNla2FnZW95Z2VhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0NjU1OTAsImV4cCI6MjEwMTA0MTU5MH0.2GvmyU0sB2tlNCqRpTY4Gnr8bB57ngoR_lQHm7g6au4';

function starString(n){
  return '★★★★★☆☆☆☆☆'.slice(5 - n, 10 - n);
}

async function waitForSupabase(timeoutMs){
  const start = Date.now();
  while (!window.supabase) {
    if (Date.now() - start > timeoutMs) return false;
    await new Promise(r => setTimeout(r, 100));
  }
  return true;
}

async function loadReviews(){
  const summaryScore = document.getElementById('summary-score');
  const summaryStars = document.getElementById('summary-stars');
  const summaryCount = document.getElementById('summary-count');
  const list = document.getElementById('review-list');

  try {
    const loaded = await waitForSupabase(6000);
    if (!loaded) throw new Error('The database library did not load after 6 seconds. This may be a slow connection, or your network/browser is blocking cdn.jsdelivr.net.');
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const { data, error } = await supabase
      .from('reviews')
      .select('customer_name, rating, taste_rating, packaging_rating, communication_rating, review_text, order_reference, created_at')
      .eq('approved', true)
      .order('created_at', { ascending: false });

    if (error) throw error;

    if (!data || data.length === 0) {
      summaryScore.textContent = '—';
      summaryStars.textContent = '';
      summaryCount.textContent = 'No reviews yet — be the first!';
      list.innerHTML = '';
      return;
    }

    const avg = data.reduce((sum, r) => sum + r.rating, 0) / data.length;
    summaryScore.textContent = avg.toFixed(1);
    summaryStars.textContent = starString(Math.round(avg));
    summaryCount.textContent = `Based on ${data.length} review${data.length === 1 ? '' : 's'}`;

    list.innerHTML = data.map(r => {
      const subParts = [];
      if (r.taste_rating) subParts.push(`<span>Taste: <b>${r.taste_rating}★</b></span>`);
      if (r.packaging_rating) subParts.push(`<span>Packaging: <b>${r.packaging_rating}★</b></span>`);
      if (r.communication_rating) subParts.push(`<span>Communication: <b>${r.communication_rating}★</b></span>`);
      const subRow = subParts.length ? `<div class="sub-ratings">${subParts.join('')}</div>` : '';
      const orderRow = r.order_reference ? `<div class="review-order">Ordered: ${escapeHtml(r.order_reference)}</div>` : '';
      const textRow = r.review_text ? `<div class="review-text">${escapeHtml(r.review_text)}</div>` : '';
      return `
        <div class="review-card">
          <div class="review-top">
            <span class="review-name">${escapeHtml(r.customer_name)}</span>
            <span class="review-stars">${starString(r.rating)}</span>
          </div>
          ${orderRow}
          ${textRow}
          ${subRow}
        </div>
      `;
    }).join('');
  } catch (err) {
    console.error(err);
    summaryCount.textContent = 'Could not load reviews: ' + (err && err.message ? err.message : String(err));
  }
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

loadReviews();

function scatterPageAccents() {
  const sectionSelectors = ['.hero'];
  const sections = sectionSelectors
    .map(sel => Array.from(document.querySelectorAll(sel)).find(el => el.offsetParent !== null))
    .filter(Boolean);
  if (sections.length === 0) return;

  const glyphs = ['✦', '✧', '✨', '♥', '⋆'];
  const anims = ['', 'drift', 'sway'];
  const starColors = ['#c8912f', '#e20376'];

  function buildFor(section, sparkleN, starN, heartN) {
    const rect = section.getBoundingClientRect();
    const height = Math.max(rect.height, 80);
    const width = Math.max(rect.width, 200);
    const placed = [];
    const entries = [];

    function findSpot(radius, excludeEntry) {
      for (let attempt = 0; attempt < 12; attempt++) {
        const topPx = Math.random() * height;
        const leftPercent = Math.random() * 100;
        const leftPx = (leftPercent / 100) * width;
        const collides = placed.some(p => {
          if (p === excludeEntry) return false;
          const dx = p.leftPx - leftPx;
          const dy = p.topPx - topPx;
          const minDist = p.radius + radius + 16;
          return (dx * dx + dy * dy) < (minDist * minDist);
        });
        if (!collides) return { topPx, leftPercent, leftPx };
      }
      return null;
    }

    function scheduleWander(entry) {
      const waitMs = 5000 + Math.random() * 6000;
      setTimeout(() => {
        entry.el.style.animationPlayState = 'paused';
        entry.el.style.transition = 'opacity 0.6s ease';
        entry.el.style.opacity = '0';
        setTimeout(() => {
          const spot = findSpot(entry.radius, entry);
          if (spot) {
            entry.el.style.top = spot.topPx + 'px';
            entry.el.style.left = spot.leftPercent + '%';
            Object.assign(entry, spot);
            const i = placed.indexOf(entry);
            if (i >= 0) placed[i] = entry;
          }
          entry.el.style.opacity = '1';
          setTimeout(() => { entry.el.style.animationPlayState = 'running'; }, 650);
          scheduleWander(entry);
        }, 650);
      }, waitMs);
    }

    const wrap = document.createElement('div');
    wrap.style.cssText = 'position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0; overflow:hidden;';

    for (let i = 0; i < sparkleN; i++) {
      const size = 9 + Math.random() * 12;
      const radius = size * 0.6;
      const spot = findSpot(radius);
      if (!spot) continue;
      const el = document.createElement('span');
      const glyph = glyphs[Math.floor(Math.random() * glyphs.length)];
      const anim = anims[Math.floor(Math.random() * anims.length)];
      el.className = `sparkle ${anim}`;
      el.style.cssText = `top:${spot.topPx}px; left:${spot.leftPercent}%; font-size:${size}px; animation-delay:${Math.random() * 4}s;`;
      el.textContent = glyph;
      wrap.appendChild(el);
      const entry = { ...spot, radius, el };
      placed.push(entry); entries.push(entry);
    }

    for (let i = 0; i < starN; i++) {
      const size = 15 + Math.random() * 8;
      const radius = size * 0.6;
      const spot = findSpot(radius);
      if (!spot) continue;
      const el = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      el.setAttribute('viewBox', '0 0 100 100');
      const rotate = Math.random() * 30 - 15;
      const duration = 6 + Math.random() * 4;
      const color = starColors[Math.floor(Math.random() * starColors.length)];
      el.style.cssText = `position:absolute; top:${spot.topPx}px; left:${spot.leftPercent}%; width:${size}px; height:${size}px; color:${color}; filter:drop-shadow(0 2px 4px rgba(58,36,48,0.2)); animation:starSpin ${duration}s linear infinite; transform:rotate(${rotate}deg);`;
      el.innerHTML = '<path d="M50 2 L61 38 L98 38 L68 60 L79 96 L50 74 L21 96 L32 60 L2 38 L39 38 Z" fill="currentColor" stroke="#fff" stroke-width="3"/>';
      wrap.appendChild(el);
      const entry = { ...spot, radius, el };
      placed.push(entry); entries.push(entry);
    }

    for (let i = 0; i < heartN; i++) {
      const size = 13 + Math.random() * 7;
      const radius = size * 0.6;
      const spot = findSpot(radius);
      if (!spot) continue;
      const el = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      el.setAttribute('class', 'sticker-gem');
      el.setAttribute('viewBox', '0 0 100 90');
      const rotate = Math.random() * 20 - 10;
      el.style.cssText = `position:absolute; top:${spot.topPx}px; left:${spot.leftPercent}%; width:${size}px; height:${size * 0.9}px; color:#ff8fc4; transform:rotate(${rotate}deg);`;
      el.innerHTML = '<use href="#gemHeartShape"/>';
      wrap.appendChild(el);
      const entry = { ...spot, radius, el };
      placed.push(entry); entries.push(entry);
    }

    if (getComputedStyle(section).position === 'static') section.style.position = 'relative';
    section.insertBefore(wrap, section.firstChild);
    entries.forEach(scheduleWander);
  }

  const heights = sections.map(s => Math.max(s.getBoundingClientRect().height, 80));
  const totalH = heights.reduce((a, b) => a + b, 0);
  sections.forEach((section, i) => {
    const share = heights[i] / totalH;
    buildFor(
      section,
      Math.round(18 * share),
      i === 0 ? 2 : 0,
      i === sections.length - 1 ? 2 : 0
    );
  });
}

window.addEventListener('load', () => {
  setTimeout(() => scatterPageAccents(), 300);
});
</script>

<script>
function smartBack(e, fallbackUrl) {
  e.preventDefault();
  var navigatedAway = false;
  var markNavigated = function(){ navigatedAway = true; };
  window.addEventListener('pagehide', markNavigated, { once: true });
  history.back();
  setTimeout(function() {
    window.removeEventListener('pagehide', markNavigated);
    if (!navigatedAway) {
      window.location.href = fallbackUrl;
    }
  }, 800);
  return false;
}
</script>
