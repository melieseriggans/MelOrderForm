<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#e20376" />
<title>FAQ ♡ — Mel's Treats</title>
<meta name="description" content="Answers to common questions about ordering from Mel's Treat — pickup, delivery, allergies, and more.">
<meta property="og:title" content="FAQ — Mel's Treats">
<meta property="og:description" content="Answers to common questions about ordering from Mel's Treat.">
<meta property="og:image" content="https://ordertreats.melstreat.com/assets/logo.png">
<meta property="og:type" content="website">
<link rel="icon" type="image/png" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Baloo+2:wght@600;700;800&family=Pacifico&family=Quicksand:wght@500;600;700&family=Nunito:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blush:#fedde4; --pink-mid:#ffcfe0; --pink-hot:#e20376; --pink-deep:#a8025f; --pink-glow:#ff6fb0;
    --gold:#c8912f; --gold-light:#f8e8c8;
    --ink:#3a2430; --ink-soft:#8a6b78; --cream:#fffaf6; --white:#ffffff; --border:#f7c3d6;
    --shadow: 0 6px 20px rgba(226,3,118,0.10);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    position:relative;margin:0; background:var(--blush); font-family:'Quicksand', sans-serif; color:var(--ink);
    background-image: linear-gradient(rgba(254,221,228,0.6), rgba(254,221,228,0.6)), url('assets/about-leopard-recolor.jpg');
    background-size: cover, 200px auto;
    background-attachment: fixed, fixed;
  }
  a{color:inherit;}

  .seal{position:relative; display:inline-block; border-radius:50%;}

  .top-nav{position:sticky; top:0; z-index:50; background:rgba(255,255,255,0.94); backdrop-filter:blur(10px); border-bottom:1px solid var(--border);}
  .nav-inner{max-width:1100px; margin:0 auto; padding:12px 20px; display:flex; justify-content:space-between; align-items:center; gap:12px;}
  .nav-brand{display:flex; align-items:center; gap:14px; text-decoration:none;}
  .nav-brand img{width:52px; height:52px; object-fit:cover;}
  .nav-brand .wordmark{font-family:'Fredoka', sans-serif; font-weight:700; color:var(--ink); font-size:1.05rem;}

  /* Back button now lives right at the top, under the nav — no more
     hunting at the bottom of a long FAQ list to get back. */
  .back-row{max-width:560px; margin:0 auto; padding:16px 20px 0;}
  .back-btn{
    display:inline-flex; align-items:center; gap:6px; background:var(--white); color:#e20376;
    border:1.5px solid var(--pink-hot); border-radius:16px; padding:10px 18px;
    font-family:'Fredoka', sans-serif; font-weight:600; font-size:0.88rem; text-decoration:none; cursor:pointer;
  }
  .back-btn:hover{background:var(--pink-hot); color:var(--white);}

  .hero{max-width:560px; margin:0 auto; padding:22px 24px 4px; text-align:center; position:relative;}
  .sparkle{
    position:absolute; color:#c8912f; pointer-events:none; z-index:2;
    text-shadow:0 0 6px #fff, 0 0 10px var(--pink-glow);
    animation:sparkle-twinkle 2.2s ease-in-out infinite;
  }
  @keyframes sparkle-twinkle{ 0%,100%{opacity:0.25; transform:scale(0.8);} 50%{opacity:1; transform:scale(1.15);} }
  .sparkle.drift{ animation:sparkle-drift 6s ease-in infinite, sparkle-twinkle 1.8s ease-in-out infinite; }
  @keyframes sparkle-drift{
    0%{transform:translateY(0) translateX(0) rotate(0deg); opacity:0;}
    10%{opacity:1;} 90%{opacity:0.8;}
    100%{transform:translateY(-90px) translateX(10px) rotate(25deg); opacity:0;}
  }
  .sparkle.sway{ animation:sparkle-sway 4.5s ease-in-out infinite; }
  @keyframes sparkle-sway{ 0%,100%{transform:translateX(0) rotate(-8deg); opacity:0.5;} 50%{transform:translateX(8px) rotate(8deg); opacity:1;} }
  @media (prefers-reduced-motion: reduce){ .sparkle{animation:none !important; opacity:0.5;} }
  .eyebrow{
    display:inline-flex; align-items:center; gap:8px; font-family:'Fredoka', sans-serif; font-size:0.76rem;
    font-weight:600; color:#e20376; letter-spacing:1.2px; text-transform:uppercase; margin-bottom:10px;
  }
  .eyebrow::before, .eyebrow::after{content:'✦'; color:#c8912f; font-size:0.65rem;}
  h1{font-family:'Baloo 2', cursive; font-weight:800; font-size:clamp(1.9rem, 5.6vw, 2.5rem); color:#e20376; margin:0 0 8px; -webkit-text-stroke:1.2px var(--white); text-shadow:1.5px 1.5px 0 var(--white), -1px -1px 0 var(--white), 0 0 14px var(--pink-glow);}
  .hero-sub{font-family:'Nunito', sans-serif; font-weight:600; font-size:0.96rem; color:var(--ink-soft); max-width:420px; margin:0 auto; line-height:1.6;}

  .container{max-width:560px; margin:0 auto; padding:26px 20px 40px;}

  .card{
    background:var(--white); border-radius:22px; padding:6px 20px; margin-bottom:18px;
    box-shadow:var(--shadow); border:1.5px solid var(--border);
  }
  .faq-category{
    font-family:'Fredoka', sans-serif; font-weight:700; font-size:0.72rem; letter-spacing:0.8px; text-transform:uppercase;
    color:var(--gold); padding:18px 0 6px;
  }
  .faq-category:first-child{padding-top:0;}
  .faq-item{border-bottom:1px solid var(--blush);}
  .faq-item:last-child{border-bottom:none;}
  .faq-q{
    width:100%; background:none; border:none; text-align:left; font-family:'Fredoka', sans-serif;
    font-weight:600; font-size:0.94rem; color:#e20376; cursor:pointer;
    display:flex; justify-content:space-between; align-items:center; gap:10px; padding:14px 0; min-height:44px; box-sizing:border-box;
  }
  .faq-q .chev{transition:transform 0.15s; font-size:1.15rem; flex-shrink:0; color:#c8912f;}
  .faq-item.open .chev{transform:rotate(45deg);}
  .faq-a{font-family:'Nunito', sans-serif; font-weight:600; display:none; font-size:0.9rem; color:var(--ink-soft); margin-top:10px; line-height:1.65; padding-bottom:16px;}
  .faq-item.open .faq-a{display:block;}

  .footer-note{text-align:center; font-size:0.8rem; color:var(--ink-soft); margin-top:8px;}

  .hero-star-accent{
    position:absolute; width:26px; height:26px;
    animation:starSpin 7s linear infinite;
  }
  @keyframes starSpin{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }
  @media (prefers-reduced-motion: reduce){ .hero-star-accent{animation:none;} }

  .sticker-star{
    position:absolute; pointer-events:none; z-index:2;
    filter:drop-shadow(0 3px 5px rgba(58,36,48,0.25));
  }
  .sticker-gem{
    position:absolute; pointer-events:none; z-index:2;
    filter:drop-shadow(0 3px 5px rgba(58,36,48,0.25));
    animation:gem-pulse 3s ease-in-out infinite;
  }
  @keyframes gem-pulse{ 0%,100%{opacity:0.85; transform:scale(1);} 50%{opacity:1; transform:scale(1.06);} }
  @media (prefers-reduced-motion: reduce){ .sticker-gem{animation:none;} }
</style>
</head>
<body>

<svg style="display:none;">
  <symbol id="stickerStarShape" viewBox="0 0 100 100">
    <path d="M50 4 L61 36 L96 36 L67 56 L78 90 L50 70 L22 90 L33 56 L4 36 L39 36 Z" fill="currentColor" stroke="#fff" stroke-width="4"/>
  </symbol>
  <symbol id="gemHeartShape" viewBox="0 0 100 90">
    <path d="M50 88 C20 62 4 42 4 24 C4 8 16 0 30 0 C40 0 47 6 50 14 C53 6 60 0 70 0 C84 0 96 8 96 24 C96 42 80 62 50 88 Z" fill="currentColor" stroke="#fff" stroke-width="4"/>
    <path d="M50 14 L50 82 M20 30 L80 30" stroke="#fff" stroke-width="1.5" opacity="0.5"/>
  </symbol>
</svg>


<nav class="top-nav">
  <div class="nav-inner">
    <a href="shop.html" class="nav-brand">
      <span class="seal"><img src="assets/logo.png" alt="Mel's Treat"></span>
      <span class="wordmark">Mel's Treat</span>
    </a>
  </div>
</nav>

<div class="back-row">
  <a href="shop.html" class="back-btn" id="back-link" onclick="return smartBack(event, 'shop.html')">← Back</a>
</div>

<div class="hero">

  <div class="eyebrow">Sweet Questions</div>
  <h1 style="position:relative; display:inline-block;">FAQ ♡
    <svg class="hero-star-accent" viewBox="0 0 100 100" style="top:-16px; right:-24px;" aria-hidden="true">
      <defs>
        <linearGradient id="starGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#ff8fc4"/>
          <stop offset="55%" stop-color="#e20376"/>
          <stop offset="100%" stop-color="#a8025f"/>
        </linearGradient>
      </defs>
      <path d="M50 2 L61 38 L98 38 L68 60 L79 96 L50 74 L21 96 L32 60 L2 38 L39 38 Z" fill="url(#starGrad1)" stroke="#fff" stroke-width="2"/>
      <ellipse cx="40" cy="30" rx="9" ry="5" fill="#ffffff" opacity="0.55" transform="rotate(-30 40 30)"/>
    </svg></h1>
  <p class="hero-sub">Everything you've been wondering about ordering from Mel's Treat ✨</p>
</div>

<div class="container">
  <div class="card" id="faq-list"></div>

  <div class="footer-note">🍪 Baked With Love 🎀</div>
</div>

<script>
function smartBack(e, fallbackUrl) {
  e.preventDefault();
  var navigatedAway = false;
  var markNavigated = function(){ navigatedAway = true; };
  window.addEventListener('pagehide', markNavigated, { once: true });
  history.back();
  setTimeout(function() {
    window.removeEventListener('pagehide', markNavigated);
    if (!navigatedAway) {
      window.location.href = fallbackUrl;
    }
  }, 800);
  return false;
}

const FAQ_CATEGORIES = [
  {
    category: "Ordering",
    items: [
      { q: "How Do I Place An Order?", a: "Just pick your cookies or a box from the shop, add them to your cart, choose your pickup or delivery day & time, and check out ♡ Easy as pie… or, well, cookie!" },
      { q: "When Are My Cookies Baked?", a: "Every order is baked fresh just for you on your chosen day — never sitting on a shelf. That's why we ask you to pick a day in advance!" },
      { q: "How Far In Advance Should I Order?", a: "Please try to order at least 2-3 days before you want your cookies. For bigger boxes or special occasions, a few days extra never hurts ✨" },
    ]
  },
  {
    category: "Pickup & Delivery",
    items: [
      { q: "What Are Your Pickup & Delivery Hours?", a: "Pickups and deliveries are available from 7:30am - 6:00pm on your selected day — nothing after that, so my cookies can get their beauty sleep too 💤" },
      { q: "Do You Deliver Or Ship?", a: "I offer local pickup and local delivery (+$3) right in the order form — just pick whichever works best for you at checkout. We don't ship out of the local area yet, so every cookie arrives as fresh as possible!" },
    ]
  },
  {
    category: "About The Cookies",
    items: [
      { q: "Can I Mix Flavors In My Box?", a: "Yes! On any assorted box (4, 6, or 12 count) you can pick exactly which flavors you want. Mix, match, and treat yourself ♡" },
      { q: "How Big Are Your Cookies?", a: "Each cookie is a hearty 4 ounces — big, soft, and definitely worth every bite 🍪" },
      { q: "What Allergens Should I Know About?", a: "Our cookies are made in a kitchen that handles soy, milk, eggs, dairy, and gluten/wheat. Please order with care if you have allergies!" },
      { q: "How Should I Store My Cookies?", a: "Keep them in an airtight container at room temp for up to 5 days, or freeze them for up to a month. Want them extra gooey? Pop one in the microwave for 8-10 seconds — heaven 🍪" },
    ]
  },
  {
    category: "Custom Orders & Policies",
    items: [
      { q: "Do You Do Custom Orders Or Events?", a: "Absolutely! Birthdays, bridal showers, office treats — reach out and let's make something sweet together. Just message me with your idea, or check out the Catering page for 3+ dozen orders ✨" },
      { q: "What's Your Refund Policy?", a: "Because everything is baked fresh to order, all sales are final. But if something's not right, please reach out — your happiness means everything to me ♡" },
    ]
  },
];

const list = document.getElementById('faq-list');
FAQ_CATEGORIES.forEach(group => {
  const heading = document.createElement('div');
  heading.className = 'faq-category';
  heading.textContent = group.category;
  list.appendChild(heading);

  group.items.forEach((item) => {
    const row = document.createElement('div');
    row.className = 'faq-item';
    row.innerHTML = `
      <button type="button" class="faq-q">${item.q} <span class="chev">+</span></button>
      <div class="faq-a">${item.a}</div>
    `;
    list.appendChild(row);
    row.querySelector('.faq-q').addEventListener('click', () => {
      row.classList.toggle('open');
    });
  });
});

function scatterPageAccents() {
  const sectionSelectors = ['.hero', '.card'];
  const sections = sectionSelectors
    .map(sel => Array.from(document.querySelectorAll(sel)).find(el => el.offsetParent !== null))
    .filter(Boolean);
  if (sections.length === 0) return;

  const glyphs = ['✦', '✧', '✨', '♥', '⋆'];
  const anims = ['', 'drift', 'sway'];
  const starColors = ['#c8912f', '#e20376'];

  function buildFor(section, sparkleN, starN, heartN) {
    const rect = section.getBoundingClientRect();
    const height = Math.max(rect.height, 80);
    const width = Math.max(rect.width, 200);
    const placed = [];
    const entries = [];

    function findSpot(radius, excludeEntry) {
      for (let attempt = 0; attempt < 12; attempt++) {
        const topPx = Math.random() * height;
        const leftPercent = Math.random() * 100;
        const leftPx = (leftPercent / 100) * width;
        const collides = placed.some(p => {
          if (p === excludeEntry) return false;
          const dx = p.leftPx - leftPx;
          const dy = p.topPx - topPx;
          const minDist = p.radius + radius + 16;
          return (dx * dx + dy * dy) < (minDist * minDist);
        });
        if (!collides) return { topPx, leftPercent, leftPx };
      }
      return null;
    }

    function scheduleWander(entry) {
      const waitMs = 5000 + Math.random() * 6000;
      setTimeout(() => {
        entry.el.style.animationPlayState = 'paused';
        entry.el.style.transition = 'opacity 0.6s ease';
        entry.el.style.opacity = '0';
        setTimeout(() => {
          const spot = findSpot(entry.radius, entry);
          if (spot) {
            entry.el.style.top = spot.topPx + 'px';
            entry.el.style.left = spot.leftPercent + '%';
            Object.assign(entry, spot);
            const i = placed.indexOf(entry);
            if (i >= 0) placed[i] = entry;
          }
          entry.el.style.opacity = '1';
          setTimeout(() => { entry.el.style.animationPlayState = 'running'; }, 650);
          scheduleWander(entry);
        }, 650);
      }, waitMs);
    }

    const wrap = document.createElement('div');
    wrap.style.cssText = 'position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0; overflow:hidden;';

    for (let i = 0; i < sparkleN; i++) {
      const size = 9 + Math.random() * 12;
      const radius = size * 0.6;
      const spot = findSpot(radius);
      if (!spot) continue;
      const el = document.createElement('span');
      const glyph = glyphs[Math.floor(Math.random() * glyphs.length)];
      const anim = anims[Math.floor(Math.random() * anims.length)];
      el.className = `sparkle ${anim}`;
      el.style.cssText = `top:${spot.topPx}px; left:${spot.leftPercent}%; font-size:${size}px; animation-delay:${Math.random() * 4}s;`;
      el.textContent = glyph;
      wrap.appendChild(el);
      const entry = { ...spot, radius, el };
      placed.push(entry); entries.push(entry);
    }

    for (let i = 0; i < starN; i++) {
      const size = 15 + Math.random() * 8;
      const radius = size * 0.6;
      const spot = findSpot(radius);
      if (!spot) continue;
      const el = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      el.setAttribute('viewBox', '0 0 100 100');
      const rotate = Math.random() * 30 - 15;
      const duration = 6 + Math.random() * 4;
      const color = starColors[Math.floor(Math.random() * starColors.length)];
      el.style.cssText = `position:absolute; top:${spot.topPx}px; left:${spot.leftPercent}%; width:${size}px; height:${size}px; color:${color}; filter:drop-shadow(0 2px 4px rgba(58,36,48,0.2)); animation:starSpin ${duration}s linear infinite; transform:rotate(${rotate}deg);`;
      el.innerHTML = '<path d="M50 2 L61 38 L98 38 L68 60 L79 96 L50 74 L21 96 L32 60 L2 38 L39 38 Z" fill="currentColor" stroke="#fff" stroke-width="3"/>';
      wrap.appendChild(el);
      const entry = { ...spot, radius, el };
      placed.push(entry); entries.push(entry);
    }

    for (let i = 0; i < heartN; i++) {
      const size = 13 + Math.random() * 7;
      const radius = size * 0.6;
      const spot = findSpot(radius);
      if (!spot) continue;
      const el = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      el.setAttribute('class', 'sticker-gem');
      el.setAttribute('viewBox', '0 0 100 90');
      const rotate = Math.random() * 20 - 10;
      el.style.cssText = `position:absolute; top:${spot.topPx}px; left:${spot.leftPercent}%; width:${size}px; height:${size * 0.9}px; color:#ff8fc4; transform:rotate(${rotate}deg);`;
      el.innerHTML = '<use href="#gemHeartShape"/>';
      wrap.appendChild(el);
      const entry = { ...spot, radius, el };
      placed.push(entry); entries.push(entry);
    }

    if (getComputedStyle(section).position === 'static') section.style.position = 'relative';
    section.insertBefore(wrap, section.firstChild);
    entries.forEach(scheduleWander);
  }

  const heights = sections.map(s => Math.max(s.getBoundingClientRect().height, 80));
  const totalH = heights.reduce((a, b) => a + b, 0);
  sections.forEach((section, i) => {
    const share = heights[i] / totalH;
    buildFor(
      section,
      Math.round(22 * share),
      i === 0 ? 2 : 0,
      i === sections.length - 1 ? 2 : 0
    );
  });
}

window.addEventListener('load', () => {
  setTimeout(() => scatterPageAccents(), 300);
});
</script>

</body>
</html>
