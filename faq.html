<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FAQ ♡ — Mel's Treats</title>
<link rel="icon" type="image/png" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Pacifico&display=swap" rel="stylesheet">
<style>
  :root{
    --pink-light:#fedde4;
    --pink-hot:#e20376;
    --white:#ffffff;
    --ink:#3a2430;
    --ink-soft:#8a6b78;
    --border:#f7c3d6;
    --shadow: 0 6px 20px rgba(226,3,118,0.10);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--pink-light);
    font-family:'Quicksand', sans-serif;
    color:var(--ink);
    padding-bottom:60px;
  }
  .banner{
    background:linear-gradient(135deg, var(--pink-hot), #ff5fa8);
    padding:48px 20px 56px;
    text-align:center;
    color:var(--white);
    border-radius:0 0 32px 32px;
    box-shadow:var(--shadow);
  }
  .banner .eyebrow{
    font-size:0.8rem;
    font-weight:700;
    letter-spacing:1px;
    text-transform:uppercase;
    opacity:0.85;
    margin-bottom:6px;
  }
  .banner-logo{
    width:104px;
    height:104px;
    border-radius:50%;
    object-fit:cover;
    margin-bottom:6px;
    box-shadow:0 4px 14px rgba(0,0,0,0.15);
  }
  .banner h1{
    font-family:'Pacifico', cursive;
    font-size:2.4rem;
    margin:0 0 6px;
    letter-spacing:0.5px;
  }
  .banner .sub{
    font-size:1.05rem;
    max-width:480px;
    margin:0 auto;
    opacity:0.96;
  }
  .container{
    max-width:560px;
    margin:-28px auto 0;
    padding:0 16px;
  }
  .card{
    background:var(--white);
    border-radius:22px;
    padding:10px 20px;
    margin-bottom:18px;
    box-shadow:var(--shadow);
    border:1px solid var(--border);
  }
  .faq-item{
    border-bottom:1px solid var(--pink-light);
    padding:14px 0;
  }
  .faq-item:last-child{border-bottom:none;}
  .faq-q{
    width:100%;
    background:none;
    border:none;
    text-align:left;
    font-family:inherit;
    font-weight:700;
    font-size:0.98rem;
    color:var(--pink-hot);
    cursor:pointer;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    padding:0;
  }
  .faq-q .chev{
    transition:transform 0.15s;
    font-size:1.2rem;
    flex-shrink:0;
  }
  .faq-item.open .chev{transform:rotate(45deg);}
  .faq-a{
    display:none;
    font-size:0.88rem;
    color:var(--ink-soft);
    margin-top:10px;
    line-height:1.5;
  }
  .faq-item.open .faq-a{display:block;}
  .back-btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:var(--white);
    color:var(--pink-hot);
    border:1.5px solid var(--pink-hot);
    border-radius:16px;
    padding:12px 20px;
    font-family:inherit;
    font-weight:700;
    font-size:0.95rem;
    text-decoration:none;
    cursor:pointer;
  }
  .back-btn:hover{background:var(--pink-light);}
  .back-wrap{text-align:center; margin-top:6px;}
  .footer-note{
    text-align:center;
    font-size:0.8rem;
    color:var(--ink-soft);
    margin-top:18px;
  }
</style>
</head>
<body>

<div class="banner">
  <img src="assets/logo.png" alt="Mel's Treat" class="banner-logo">
  <div class="eyebrow">Sweet Questions</div>
  <h1>FAQ ♡</h1>
  <div class="sub">Everything You've Been Wondering About Ordering From Mel's Treats ✨</div>
</div>

<div class="container">
  <div class="card" id="faq-list"></div>

  <div class="back-wrap">
    <a href="index.html" class="back-btn" id="back-link" onclick="if(document.referrer && document.referrer.indexOf(window.location.host) !== -1){history.back(); return false;}">← Back</a>
  </div>

  <div class="footer-note">🍪 Baked With Love 🎀</div>
</div>

<script>
const FAQS = [
  { q: "How Do I Place An Order?", a: "Just Pick Your Cookies Or A Box From The Shop, Add Them To Your Cart, Choose Your Pickup Day & Time, And Check Out ♡ Easy As Pie… Or, Well, Cookie!" },
  { q: "When Are My Cookies Baked?", a: "Every Order Is Baked Fresh Just For You On Your Chosen Pickup Day — Never Sitting On A Shelf. That's Why We Ask You To Pick A Day In Advance!" },
  { q: "How Far In Advance Should I Order?", a: "Please Try To Order At Least 48 Hours Before You Want To Pick Up. For Bigger Boxes Or Special Occasions, A Few Days Extra Never Hurts ✨" },
  { q: "What Are Your Pickup Hours?", a: "Pickups Are Available From 7:30 AM Through 4:30 PM On Your Selected Day — Nothing After 5 PM, So My Cookies Can Get Their Beauty Sleep Too 💤" },
  { q: "Do You Deliver Or Ship?", a: "Right Now, We're Pickup Only So Every Cookie Arrives As Fresh As Possible. Stay Tuned For Local Delivery Updates!" },
  { q: "Can I Mix Flavors In My Box?", a: "Yes! On Any Assorted Box (4, 6, Or 12 Count) You Can Pick Exactly Which Flavors You Want. Mix, Match, And Treat Yourself ♡" },
  { q: "How Big Are Your Cookies?", a: "Each Cookie Is A Hearty 4 Ounces — Big, Soft, And Definitely Worth Every Bite 🍪" },
  { q: "What Allergens Should I Know About?", a: "Our Cookies Are Made In A Kitchen That Handles Soy, Milk, Eggs, Dairy, And Gluten/Wheat. Please Order With Care If You Have Allergies!" },
  { q: "Do You Do Custom Orders Or Events?", a: "Absolutely! Birthdays, Bridal Showers, Office Treats — Reach Out And Let's Make Something Sweet Together. Just Message Me With Your Idea ✨" },
  { q: "How Should I Store My Cookies?", a: "Keep Them In An Airtight Container At Room Temp For Up To 3 Days. Want Them Extra Gooey? Pop One In The Microwave For 8 Seconds — Heaven 🍪" },
  { q: "What's Your Refund Policy?", a: "Because Everything Is Baked Fresh To Order, All Sales Are Final. But If Something's Not Right, Please Reach Out — Your Happiness Means Everything To Me ♡" },
];

const list = document.getElementById('faq-list');
FAQS.forEach((item, i) => {
  const row = document.createElement('div');
  row.className = 'faq-item';
  row.innerHTML = `
    <button type="button" class="faq-q">${item.q} <span class="chev">+</span></button>
    <div class="faq-a">${item.a}</div>
  `;
  list.appendChild(row);
  row.querySelector('.faq-q').addEventListener('click', () => {
    row.classList.toggle('open');
  });
});
</script>

</body>
</html>
