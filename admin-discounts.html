<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#fedde4" />
<title>Discount Codes – Admin</title>
<link rel="icon" type="image/png" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Pacifico&display=swap" rel="stylesheet">
<style>
  :root{
    --pink-light:#fedde4;
    --pink-hot:#e20376;
    --white:#ffffff;
    --ink:#3a2430;
    --ink-soft:#8a6b78;
    --border:#f7c3d6;
    --shadow: 0 6px 20px rgba(226,3,118,0.10);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--pink-light);
    font-family:'Quicksand', sans-serif;
    color:var(--ink);
    padding-bottom:60px;
  }
  .banner{
    background:linear-gradient(135deg, var(--pink-hot), #ff5fa8);
    padding:36px 20px 44px;
    text-align:center;
    color:var(--white);
    border-radius:0 0 32px 32px;
    box-shadow:var(--shadow);
  }
  .banner h1{
    font-family:'Pacifico', cursive;
    font-size:1.9rem;
    margin:0;
  }
  .container{
    max-width:560px;
    margin:-24px auto 0;
    padding:0 16px;
  }
  .card{
    background:var(--white);
    border-radius:22px;
    padding:22px 20px;
    margin-bottom:18px;
    box-shadow:var(--shadow);
    border:1px solid var(--border);
  }
  h2{
    font-family:'Pacifico', cursive;
    color:var(--pink-hot);
    font-size:1.3rem;
    margin:0 0 12px;
  }
  label{
    display:block;
    font-weight:700;
    font-size:0.85rem;
    margin:12px 0 6px;
  }
  label:first-child{margin-top:0;}
  input[type=text], input[type=number], input[type=password], input[type=date]{
    width:100%;
    padding:11px 13px;
    border-radius:12px;
    border:1.5px solid var(--border);
    font-family:inherit;
    font-size:0.92rem;
    background:var(--white);
    color:var(--ink);
  }
  input:focus{outline:2px solid var(--pink-hot); outline-offset:1px;}
  .field-row{display:flex; gap:10px;}
  .field-row > div{flex:1;}
  .btn{
    background:var(--pink-hot);
    color:var(--white);
    border:none;
    border-radius:14px;
    padding:12px 20px;
    font-size:0.95rem;
    font-weight:700;
    font-family:inherit;
    cursor:pointer;
    margin-top:14px;
  }
  .btn:hover{background:#b8025f;}
  .btn:disabled{opacity:0.6; cursor:not-allowed;}
  .btn-small{
    padding:7px 12px;
    font-size:0.8rem;
    border-radius:10px;
  }
  .btn-outline{
    background:var(--white);
    color:var(--pink-hot);
    border:1.5px solid var(--pink-hot);
  }
  .btn-outline:hover{background:var(--pink-light);}
  .error{color:#c0025e; font-size:0.85rem; margin-top:8px; display:none;}
  .hidden{display:none;}
  .code-row{
    border:1.5px solid var(--border);
    border-radius:14px;
    padding:14px 16px;
    margin-bottom:10px;
  }
  .code-row.inactive{opacity:0.55;}
  .code-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:4px;
  }
  .code-name{font-weight:700; font-size:1.05rem; color:var(--pink-hot);}
  .code-status{
    font-size:0.72rem;
    font-weight:700;
    padding:3px 10px;
    border-radius:10px;
    background:var(--pink-light);
    color:var(--pink-hot);
  }
  .code-status.inactive-badge{background:#eee; color:#888;}
  .code-detail{font-size:0.82rem; color:var(--ink-soft); margin-bottom:2px;}
  .code-actions{display:flex; gap:8px; margin-top:10px;}
  .empty-note{color:var(--ink-soft); font-size:0.88rem; text-align:center; padding:14px 0;}
</style>
</head>
<body>

<div class="banner"><h1>Discount Codes 🔒</h1></div>

<div class="container">
  <div class="card" id="login-card">
    <h2>Admin Login</h2>
    <label for="password-input">Password</label>
    <input type="password" id="password-input" placeholder="Enter admin password" />
    <div id="login-error" class="error"></div>
    <button class="btn" id="login-btn">Log In</button>
  </div>

  <div id="admin-panel" class="hidden">
    <div class="card">
      <h2>Add New Code</h2>
      <label for="new-code">Code</label>
      <input type="text" id="new-code" placeholder="e.g. WELCOME10" />

      <div class="field-row">
        <div>
          <label for="new-percent">% Off</label>
          <input type="number" id="new-percent" min="1" max="100" placeholder="e.g. 10" />
        </div>
        <div>
          <label for="new-flat">Or $ Off</label>
          <input type="number" id="new-flat" min="0" step="0.01" placeholder="e.g. 5.00" />
        </div>
      </div>

      <div class="field-row">
        <div>
          <label for="new-expires">Expires (optional)</label>
          <input type="date" id="new-expires" />
        </div>
        <div>
          <label for="new-max-uses">Max Uses (optional)</label>
          <input type="number" id="new-max-uses" min="1" placeholder="Unlimited" />
        </div>
      </div>

      <div id="create-error" class="error"></div>
      <button class="btn" id="create-btn">Add Code</button>
    </div>

    <div class="card">
      <h2>Existing Codes</h2>
      <div id="codes-list"></div>
    </div>
  </div>
</div>

<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script defer>
const SUPABASE_URL = 'https://wgicnbaoqsekageoygea.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndnaWNuYmFvcXNla2FnZW95Z2VhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0NjU1OTAsImV4cCI6MjEwMTA0MTU5MH0.2GvmyU0sB2tlNCqRpTY4Gnr8bB57ngoR_lQHm7g6au4';

let _supabaseClient = null;
async function waitForSupabase(timeoutMs) {
  const start = Date.now();
  while (!window.supabase) {
    if (Date.now() - start > timeoutMs) return false;
    await new Promise(r => setTimeout(r, 100));
  }
  return true;
}
async function getSupabase() {
  if (!_supabaseClient) {
    const loaded = await waitForSupabase(6000);
    if (!loaded) throw new Error('Could not connect. Please check your connection and try again.');
    _supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }
  return _supabaseClient;
}

let adminPassword = sessionStorage.getItem('mels_admin_pw') || null;

async function callAdmin(action, extra) {
  const supabase = await getSupabase();
  const { data, error } = await supabase.functions.invoke('manage-discount-codes', {
    body: { password: adminPassword, action, ...extra }
  });
  if (error) throw error;
  return data;
}

async function tryLogin(pw) {
  adminPassword = pw;
  const data = await callAdmin('list');
  if (!data.success) {
    adminPassword = null;
    sessionStorage.removeItem('mels_admin_pw');
    throw new Error(data.message || 'Login failed.');
  }
  sessionStorage.setItem('mels_admin_pw', pw);
  document.getElementById('login-card').classList.add('hidden');
  document.getElementById('admin-panel').classList.remove('hidden');
  renderCodes(data.codes);
}

document.getElementById('login-btn').addEventListener('click', async () => {
  const pw = document.getElementById('password-input').value;
  const errBox = document.getElementById('login-error');
  errBox.style.display = 'none';
  if (!pw) return;
  try {
    await tryLogin(pw);
  } catch (err) {
    errBox.textContent = err.message || 'Incorrect password.';
    errBox.style.display = 'block';
  }
});

document.getElementById('password-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('login-btn').click();
});

function renderCodes(codes) {
  const list = document.getElementById('codes-list');
  if (!codes || codes.length === 0) {
    list.innerHTML = '<div class="empty-note">No discount codes yet — add one above!</div>';
    return;
  }
  list.innerHTML = codes.map(c => {
    const discountText = c.percent_off ? `${c.percent_off}% off` : (c.flat_off ? `$${Number(c.flat_off).toFixed(2)} off` : 'No discount set');
    const usesText = c.max_uses ? `${c.uses_count} / ${c.max_uses} uses` : `${c.uses_count} uses (unlimited)`;
    const expiresText = c.expires_at ? `Expires ${new Date(c.expires_at).toLocaleDateString()}` : 'No expiration';
    return `
      <div class="code-row ${c.active ? '' : 'inactive'}" data-id="${c.id}">
        <div class="code-top">
          <span class="code-name">${c.code}</span>
          <span class="code-status ${c.active ? '' : 'inactive-badge'}">${c.active ? 'Active' : 'Inactive'}</span>
        </div>
        <div class="code-detail">${discountText}</div>
        <div class="code-detail">${usesText}</div>
        <div class="code-detail">${expiresText}</div>
        <div class="code-actions">
          <button class="btn btn-small btn-outline toggle-btn" data-id="${c.id}" data-active="${c.active}">${c.active ? 'Deactivate' : 'Activate'}</button>
          <button class="btn btn-small delete-btn" data-id="${c.id}" style="background:#c0025e;">Delete</button>
        </div>
      </div>
    `;
  }).join('');

  list.querySelectorAll('.toggle-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.dataset.id;
      const currentlyActive = btn.dataset.active === 'true';
      btn.disabled = true;
      try {
        await callAdmin('toggle', { id, active: !currentlyActive });
        await refreshCodes();
      } catch (err) {
        alert('Could not update code: ' + err.message);
        btn.disabled = false;
      }
    });
  });

  list.querySelectorAll('.delete-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!confirm('Delete this discount code permanently?')) return;
      const id = btn.dataset.id;
      btn.disabled = true;
      try {
        await callAdmin('delete', { id });
        await refreshCodes();
      } catch (err) {
        alert('Could not delete code: ' + err.message);
        btn.disabled = false;
      }
    });
  });
}

async function refreshCodes() {
  const data = await callAdmin('list');
  renderCodes(data.codes);
}

document.getElementById('create-btn').addEventListener('click', async () => {
  const errBox = document.getElementById('create-error');
  errBox.style.display = 'none';

  const code = document.getElementById('new-code').value.trim();
  const percent = document.getElementById('new-percent').value;
  const flat = document.getElementById('new-flat').value;
  const expires = document.getElementById('new-expires').value;
  const maxUses = document.getElementById('new-max-uses').value;

  if (!code) {
    errBox.textContent = 'Please enter a code.';
    errBox.style.display = 'block';
    return;
  }
  if (!percent && !flat) {
    errBox.textContent = 'Please set either a % off or $ off amount.';
    errBox.style.display = 'block';
    return;
  }

  const btn = document.getElementById('create-btn');
  btn.disabled = true;
  btn.textContent = 'Adding...';

  try {
    const data = await callAdmin('create', {
      code,
      percent_off: percent ? parseFloat(percent) : null,
      flat_off: flat ? parseFloat(flat) : null,
      expires_at: expires ? new Date(expires).toISOString() : null,
      max_uses: maxUses ? parseInt(maxUses) : null,
    });
    if (!data.success) throw new Error(data.message || 'Could not add code.');

    document.getElementById('new-code').value = '';
    document.getElementById('new-percent').value = '';
    document.getElementById('new-flat').value = '';
    document.getElementById('new-expires').value = '';
    document.getElementById('new-max-uses').value = '';
    await refreshCodes();
  } catch (err) {
    errBox.textContent = err.message || 'Something went wrong.';
    errBox.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Add Code';
  }
});

// Auto-login if password already saved this session
if (adminPassword) {
  tryLogin(adminPassword).catch(() => {});
}
</script>

</body>
</html>
