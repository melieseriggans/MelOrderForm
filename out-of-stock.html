<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#fedde4" />
<title>Out Of Stock – Mel's Treat</title>
<link rel="icon" type="image/png" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Pacifico&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pink-light:#fedde4;
    --pink-hot:#e20376;
    --pink-deep:#a8025f;
    --white:#ffffff;
    --ink:#3a2430;
    --ink-soft:#8a6b78;
    --border:#f7c3d6;
    --shadow: 0 6px 20px rgba(226,3,118,0.10);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--pink-light);
    font-family:'Quicksand', sans-serif;
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
  }
  .card{
    background:var(--white);
    border-radius:24px;
    padding:36px 26px;
    max-width:440px;
    text-align:center;
    box-shadow:var(--shadow);
    border:1px solid var(--border);
  }
  .logo{
    width:90px; height:90px; border-radius:50%; object-fit:cover;
    margin-bottom:16px; box-shadow:0 4px 14px rgba(0,0,0,0.15);
  }
  .emoji{font-size:2.4rem; margin-bottom:6px;}
  h1{
    font-family:'Pacifico', cursive;
    color:var(--pink-hot);
    font-size:1.7rem;
    margin:0 0 10px;
  }
  p{color:var(--ink-soft); font-size:0.95rem; line-height:1.55; margin:0 0 24px;}
  .choice-group{display:flex; flex-direction:column; gap:10px; margin-bottom:8px;}
  .choice-btn{
    font-family:'Fredoka', sans-serif;
    font-weight:600;
    font-size:0.95rem;
    padding:14px;
    border-radius:16px;
    border:1.5px solid var(--pink-hot);
    background:var(--white);
    color:var(--pink-hot);
    cursor:pointer;
    text-decoration:none;
    display:block;
    transition:0.15s;
  }
  .choice-btn.primary{background:var(--pink-hot); color:var(--white);}
  .choice-btn:hover{transform:translateY(-2px); box-shadow:var(--shadow);}
  .notify-form{display:none; text-align:left; margin-top:16px;}
  .notify-form.show{display:block;}
  label{display:block; font-weight:700; font-size:0.85rem; margin:0 0 6px;}
  input[type=email]{
    width:100%; padding:12px 14px; border-radius:12px; border:1.5px solid var(--border);
    font-family:inherit; font-size:0.92rem; margin-bottom:10px;
  }
  input:focus{outline:none; border-color:var(--pink-hot); box-shadow:0 0 0 3px rgba(226,3,118,0.1);}
  .submit-btn{
    width:100%; background:var(--pink-hot); color:var(--white); border:none; border-radius:14px;
    padding:13px; font-family:'Fredoka', sans-serif; font-weight:600; font-size:0.95rem; cursor:pointer;
  }
  .submit-btn:hover{background:var(--pink-deep);}
  .submit-btn:disabled{opacity:0.6; cursor:not-allowed;}
  .error{color:#c0025e; font-size:0.82rem; margin-top:6px; display:none;}
  .success-msg{display:none; color:var(--pink-hot); font-weight:700; font-size:0.92rem; margin-top:10px;}
  .back-link{display:inline-block; margin-top:18px; color:var(--ink-soft); font-size:0.85rem; text-decoration:none;}
  .back-link:hover{color:var(--pink-hot);}
</style>
</head>
<body>

<div class="card">
  <img src="assets/logo.png" alt="Mel's Treat" class="logo">
  <div class="emoji">🍪💤</div>
  <h1>We're Out Of Stock!</h1>
  <p>All our cookies are sold out right now — but don't worry, we're already planning our next bake! Choose an option below:</p>

  <div class="choice-group">
    <a href="index.html?preorder=1" class="choice-btn primary">Place A Pre-Order</a>
    <button type="button" class="choice-btn" id="notify-toggle-btn">Notify Me When Back In Stock</button>
  </div>

  <div class="notify-form" id="notify-form">
    <label for="notify-email">Your Email</label>
    <input type="email" id="notify-email" placeholder="you@example.com">
    <div id="notify-error" class="error"></div>
    <div id="notify-success" class="success-msg">You're on the list! We'll email you the moment we're back. 💕</div>
    <button type="button" class="submit-btn" id="notify-submit-btn">Notify Me</button>
  </div>

  <a href="index.html" class="back-link">← Back to site</a>
</div>

<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script defer>
const SUPABASE_URL = 'https://wgicnbaoqsekageoygea.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndnaWNuYmFvcXNla2FnZW95Z2VhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0NjU1OTAsImV4cCI6MjEwMTA0MTU5MH0.2GvmyU0sB2tlNCqRpTY4Gnr8bB57ngoR_lQHm7g6au4';

let _supabaseClient = null;
async function waitForSupabase(timeoutMs) {
  const start = Date.now();
  while (!window.supabase) {
    if (Date.now() - start > timeoutMs) return false;
    await new Promise(r => setTimeout(r, 100));
  }
  return true;
}
async function getSupabase() {
  if (!_supabaseClient) {
    const loaded = await waitForSupabase(6000);
    if (!loaded) throw new Error('Could not connect. Please check your connection and try again.');
    _supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }
  return _supabaseClient;
}

document.getElementById('notify-toggle-btn').addEventListener('click', () => {
  document.getElementById('notify-form').classList.toggle('show');
});

document.getElementById('notify-submit-btn').addEventListener('click', async () => {
  const errBox = document.getElementById('notify-error');
  const successBox = document.getElementById('notify-success');
  errBox.style.display = 'none';
  successBox.style.display = 'none';

  const emailInput = document.getElementById('notify-email');
  const email = emailInput.value.trim();
  if (!email || !email.includes('@')) {
    errBox.textContent = 'Please enter a valid email.';
    errBox.style.display = 'block';
    return;
  }

  const btn = document.getElementById('notify-submit-btn');
  btn.disabled = true;
  btn.textContent = 'Submitting...';
  try {
    const supabase = await getSupabase();
    const { error } = await supabase.from('restock_notifications').insert({ email });
    if (error && !String(error.message).includes('duplicate')) throw error;
    successBox.style.display = 'block';
    emailInput.value = '';
    emailInput.disabled = true;
    btn.textContent = "You're Signed Up!";
  } catch (err) {
    errBox.textContent = 'Something went wrong. Please try again.';
    errBox.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Notify Me';
  }
});
</script>

</body>
</html>
